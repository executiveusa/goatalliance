company: PNW AI Directory
purpose: AI-readable local contractor visibility with community reinvestment.
verticals:
  - plumbers
  - hvac
  - roofers
  - painters
  - pressure-washers
operating_model:
  control_plane: Paperclip
  runtime_agent: Hermes
  content_engine: markdown_blog
  search_layer:
    - llms.txt
    - llms-full.txt
    - sitemap.xml
    - schema.org JSON-LD
    - markdown posts
human_approval_required_for:
