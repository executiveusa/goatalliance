  - outreach messages
  - paid sponsorships
  - grant applications
  - production deploys
  - account settings
  - data licensing deals
metrics:
  - verified_profiles
  - paid_profiles
  - profile_audits_sold
  - sponsor_pages_sold
  - posts_published
  - leads_generated
  - community_projects_funded
  - grant_opportunities_qualified
